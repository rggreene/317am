name: Visual lab and vertical slice build
on:
  push:
    branches:
      - feature/visual-overhaul
      - feature/vertical-slice-alpha
  pull_request:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check module syntax and gameplay tests
        run: npm run check
      - name: Validate committed GLB assets
        run: npm run check:assets
      - name: Build static site
        run: npm run build
